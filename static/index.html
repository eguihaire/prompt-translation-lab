<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Scribe V1</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; max-width: 880px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #475569; margin-top: 0; }
    .row { display: flex; gap: 10px; align-items: center; margin: 12px 0 16px; flex-wrap: wrap; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-size: 14px; }
    #start { background: #0f766e; color: #fff; }
    #stop { background: #334155; color: #fff; }
    #status { font-size: 13px; color: #64748b; }
    #out {
      width: 100%;
      min-height: 360px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 14px;
      box-sizing: border-box;
      white-space: pre-wrap;
      line-height: 1.45;
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>Super Scribe V1</h1>
  <p>Clique <strong>Start</strong>, choisis <strong>un onglet Chrome</strong> et active <strong>Partager l'audio</strong>.</p>

  <div class="row">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
    <span id="status">En attente</span>
  </div>

  <div id="out" aria-live="polite"></div>

  <script>
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const statusEl = document.getElementById('status');
    const out = document.getElementById('out');

    let recorder;
    let mediaStream;
    let running = false;
    let queue = [];
    let inFlight = false;
    let transcript = '';

    function setStatus(text) { statusEl.textContent = text; }

    async function blobToBase64(blob) {
      const ab = await blob.arrayBuffer();
      const bytes = new Uint8Array(ab);
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    async function sendChunk(blob) {
      const body = {
        audio_b64: await blobToBase64(blob),
        language: 'fr',
        mime_type: blob.type || 'audio/webm'
      };

      const res = await fetch('/transcribe-chunk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error((data && data.error) ? data.error : 'Erreur transcription');
      }

      const text = (data.text || '').trim();
      if (text) {
        transcript += (transcript ? ' ' : '') + text;
        out.textContent = transcript;
        out.scrollTop = out.scrollHeight;
      }
    }

    async function flushQueue() {
      if (inFlight) return;
      inFlight = true;
      try {
        while (queue.length) {
          const blob = queue.shift();
          await sendChunk(blob);
        }
      } catch (error) {
        console.error('Transcription error:', error);
        setStatus('Erreur de transcription');
      } finally {
        inFlight = false;
      }
    }

    async function start() {
      transcript = '';
      out.textContent = '';
      queue = [];
      setStatus('Sélection de l\'onglet...');

      mediaStream = await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: true,
      });

      const audioTracks = mediaStream.getAudioTracks();
      if (!audioTracks.length) {
        throw new Error('Aucune piste audio détectée.');
      }

      const audioOnly = new MediaStream([audioTracks[0]]);
      const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : 'audio/webm';

      recorder = new MediaRecorder(audioOnly, { mimeType });
      recorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          queue.push(event.data);
          flushQueue();
        }
      };
      recorder.onstop = () => setStatus('Arrêté');

      recorder.start(350);
      running = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus('Transcription en direct...');

      audioTracks[0].addEventListener('ended', stop);
    }

    function stop() {
      if (!running) return;
      running = false;
      recorder?.stop();
      mediaStream?.getTracks().forEach(t => t.stop());
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus('Finalisation...');
      flushQueue().finally(() => setStatus('Terminé'));
    }

    startBtn.addEventListener('click', async () => {
      try {
        await start();
      } catch (error) {
        console.error('Start error:', error);
        setStatus('Erreur');
      }
    });

    stopBtn.addEventListener('click', stop);
  </script>
</body>
</html>
