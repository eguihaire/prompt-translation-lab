<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Scribe V1</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; max-width: 880px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #475569; margin-top: 0; }
    .row { display: flex; gap: 10px; align-items: center; margin: 12px 0 16px; flex-wrap: wrap; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-size: 14px; }
    #start { background: #0f766e; color: #fff; }
    #stop { background: #334155; color: #fff; }
    #status { font-size: 13px; color: #64748b; }
    #out {
      width: 100%;
      min-height: 360px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 14px;
      box-sizing: border-box;
      white-space: pre-wrap;
      line-height: 1.45;
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>Super Scribe V1</h1>
  <p>Clique <strong>Start</strong>, choisis <strong>un onglet Chrome</strong> et active <strong>Partager l'audio</strong>.</p>

  <div class="row">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
    <span id="status">En attente</span>
  </div>

  <div id="out" aria-live="polite"></div>

  <script>
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const statusEl = document.getElementById('status');
    const out = document.getElementById('out');

    let recorder;
    let mediaStream;
    let ws;
    let running = false;
    let transcript = '';

    function setStatus(text) { statusEl.textContent = text; }

    async function blobToBase64(blob) {
      const ab = await blob.arrayBuffer();
      const bytes = new Uint8Array(ab);
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function appendTranscript(text) {
      if (!text) return;
      transcript += (transcript ? ' ' : '') + text;
      out.textContent = transcript;
      out.scrollTop = out.scrollHeight;
    }

    async function connectRealtime() {
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      const url = `${protocol}://${location.host}/ws/transcribe`;

      ws = new WebSocket(url);

      ws.onopen = () => {
        setStatus('Transcription en direct...');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.text) {
            appendTranscript(data.text.trim());
          }
          if (data.error) {
            console.error('STT error:', data.error);
            setStatus('Erreur de transcription');
          }
        } catch (error) {
          console.error('WS parse error:', error);
        }
      };

      ws.onerror = (error) => {
        console.error('WS error:', error);
        setStatus('Erreur de connexion');
      };

      ws.onclose = () => {
        if (running) {
          setStatus('Connexion interrompue');
          stop();
        }
      };

      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error('Connexion timeout')), 8000);
        ws.addEventListener('open', () => {
          clearTimeout(timeout);
          resolve();
        }, { once: true });
        ws.addEventListener('error', () => {
          clearTimeout(timeout);
          reject(new Error('Connexion impossible'));
        }, { once: true });
      });
    }

    async function start() {
      transcript = '';
      out.textContent = '';
      setStatus('Sélection de l\'onglet...');

      await connectRealtime();

      mediaStream = await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: true,
      });

      const audioTracks = mediaStream.getAudioTracks();
      if (!audioTracks.length) {
        throw new Error('Aucune piste audio détectée.');
      }

      const audioOnly = new MediaStream([audioTracks[0]]);
      const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : 'audio/webm';

      recorder = new MediaRecorder(audioOnly, { mimeType });
      recorder.ondataavailable = async (e) => {
        if (!running || !ws || ws.readyState !== WebSocket.OPEN || !e.data || e.data.size === 0) {
          return;
        }

        try {
          const audio_b64 = await blobToBase64(e.data);
          ws.send(JSON.stringify({
            type: 'audio_chunk',
            audio_b64,
            mime_type: e.data.type || mimeType,
            language: 'fr'
          }));
        } catch (error) {
          console.error('Chunk send error:', error);
        }
      };

      recorder.onstop = () => setStatus('Arrêté');

      recorder.start(300);
      running = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus('Transcription en direct...');

      audioTracks[0].addEventListener('ended', stop);
    }

    function stop() {
      if (!running) return;
      running = false;
      recorder?.stop();
      mediaStream?.getTracks().forEach(t => t.stop());

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'stop' }));
        ws.close();
      }

      ws = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus('Terminé');
    }

    startBtn.addEventListener('click', async () => {
      try {
        await start();
      } catch (error) {
        console.error('Start error:', error);
        setStatus('Erreur');
        stop();
      }
    });

    stopBtn.addEventListener('click', stop);
  </script>
</body>
</html>
