<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Transcription (onglet Chrome)</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; max-width: 880px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #475569; margin-top: 0; }
    .row { display: flex; gap: 10px; align-items: center; margin: 12px 0 16px; flex-wrap: wrap; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-size: 14px; }
    #start { background: #0f766e; color: #fff; }
    #stop { background: #334155; color: #fff; }
    #status { font-size: 13px; color: #64748b; }
    #out {
      width: 100%;
      min-height: 360px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 14px;
      box-sizing: border-box;
      white-space: pre-wrap;
      line-height: 1.45;
      background: #fff;
    }
    .hint { font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <h1>Super Scribe V1</h1>
  <p>Ultra-simple : clique <strong>Démarrer</strong>, choisis <strong>un onglet Chrome</strong> et active <strong>Partager l'audio</strong>.</p>

  <div class="row">
    <button id="start">Démarrer</button>
    <button id="stop" type="button" aria-label="Arrêter la transcription" disabled>Arrêter</button>
    <span id="status">En attente</span>
  </div>

  <div id="out" aria-live="polite"></div>
  <p class="hint">La clé OpenAI reste côté serveur (env Vercel: <code>OPENAI_API_KEY</code>).</p>

  <script>
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const statusEl = document.getElementById('status');
    const out = document.getElementById('out');

    const CHUNK_MS = 3500;
    const OVERLAP_MS = 900;
    const MIN_PCM_SAMPLES = 4096;
    const MIN_RMS = 0.0015;
    let mediaStream;
    let audioContext;
    let sourceNode;
    let processorNode;
    let flushTimer;

    let running = false;
    let queue = [];
    let inFlight = false;
    let stableText = '';
    let currentBuffer = '';
    let sampleRate = 48000;
    let pendingSamples = [];
    let overlapSamples = new Float32Array(0);

    function setStatus(text) { statusEl.textContent = text; }

    function addLog(text) {
      console.debug('[Super Scribe V1]', text);
    }

    function floatTo16BitPCM(float32Array) {
      const pcm = new Int16Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i += 1) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return pcm;
    }

    function pcmToWavBytes(int16Data, wavSampleRate) {
      const byteLength = int16Data.length * 2;
      const buffer = new ArrayBuffer(44 + byteLength);
      const view = new DataView(buffer);

      function writeString(offset, str) {
        for (let i = 0; i < str.length; i += 1) view.setUint8(offset + i, str.charCodeAt(i));
      }

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + byteLength, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true); // PCM chunk size
      view.setUint16(20, 1, true); // PCM format
      view.setUint16(22, 1, true); // mono
      view.setUint32(24, wavSampleRate, true);
      view.setUint32(28, wavSampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, byteLength, true);

      let offset = 44;
      for (let i = 0; i < int16Data.length; i += 1) {
        view.setInt16(offset, int16Data[i], true);
        offset += 2;
      }

      return new Uint8Array(buffer);
    }

    function mergeChunkText(existing, incoming) {
      const cleanIncoming = (incoming || '').trim();
      if (!cleanIncoming) return existing;
      if (!existing) return cleanIncoming;

      const existingWords = existing.split(/\s+/);
      const incomingWords = cleanIncoming.split(/\s+/);
      const maxOverlap = Math.min(10, existingWords.length, incomingWords.length);

      let overlap = 0;
      for (let n = maxOverlap; n >= 1; n -= 1) {
        const tail = existingWords.slice(-n).join(' ').toLowerCase();
        const head = incomingWords.slice(0, n).join(' ').toLowerCase();
        if (tail === head) {
          overlap = n;
          break;
        }
      }

      const merged = overlap > 0 ? incomingWords.slice(overlap).join(' ') : cleanIncoming;
      if (!merged) return existing;
      return `${existing} ${merged}`.trim();
    }

    function cleanPunctuationAndCase(text) {
      let outText = (text || '').trim();
      if (!outText) return '';

      outText = outText.replace(/\s+/g, ' ');
      outText = outText.replace(/\s+([,.;:!?])/g, '$1');

      const chars = outText.split('');
      let capitalizeNext = true;
      for (let i = 0; i < chars.length; i += 1) {
        const ch = chars[i];
        if (capitalizeNext && /[a-zà-ÿ]/i.test(ch)) {
          chars[i] = ch.toLocaleUpperCase('fr-FR');
          capitalizeNext = false;
        }
        if (/[.!?]/.test(ch)) capitalizeNext = true;
      }
      return chars.join('');
    }

    function splitStableAndTail(text, forceFinalize = false) {
      const src = (text || '').trim();
      if (!src) return { stablePart: '', tailPart: '' };

      const sentenceRegex = /[^.!?]+(?:[.!?]+["'»”)]*)/g;
      const matches = [...src.matchAll(sentenceRegex)];

      if (!matches.length) return { stablePart: '', tailPart: src };

      const lastMatch = matches[matches.length - 1];
      const consumedUntil = lastMatch.index + lastMatch[0].length;
      const trailing = src.slice(consumedUntil).trim();

      if (forceFinalize) {
        const all = (matches.map((m) => m[0]).join(' ') + (trailing ? ` ${trailing}` : '')).trim();
        return { stablePart: all, tailPart: '' };
      }

      if (matches.length === 1 && !trailing) {
        return { stablePart: '', tailPart: src };
      }

      const stableSentences = matches.slice(0, -1).map((m) => m[0]).join(' ').trim();
      const lastSentence = matches[matches.length - 1][0].trim();
      const tailPart = (lastSentence + (trailing ? ` ${trailing}` : '')).trim();
      return { stablePart: stableSentences, tailPart };
    }

    function maybeStabilize(forceFinalize = false) {
      const { stablePart, tailPart } = splitStableAndTail(currentBuffer, forceFinalize);
      if (stablePart) {
        const corrected = cleanPunctuationAndCase(stablePart);
        stableText = stableText ? `${stableText} ${corrected}`.trim() : corrected;
      }
      currentBuffer = tailPart || '';
    }

    function renderTranscript() {
      const liveText = [stableText, currentBuffer].filter(Boolean).join(' ').trim();
      out.textContent = liveText;
      out.scrollTop = out.scrollHeight;
    }

    function bytesToBase64(bytes) {
      let binary = '';
      const step = 0x8000;
      for (let i = 0; i < bytes.length; i += step) {
        binary += String.fromCharCode(...bytes.subarray(i, i + step));
      }
      return btoa(binary);
    }

    function flushPcmChunk() {
      if (!pendingSamples.length) return;

      let total = 0;
      for (const s of pendingSamples) total += s.length;
      const joined = new Float32Array(total);
      let cursor = 0;
      for (const s of pendingSamples) {
        joined.set(s, cursor);
        cursor += s.length;
      }
      pendingSamples = [];

      if (joined.length < MIN_PCM_SAMPLES) return;

      let sumSquares = 0;
      for (let i = 0; i < joined.length; i += 1) sumSquares += joined[i] * joined[i];
      const rms = Math.sqrt(sumSquares / joined.length);
      if (rms < MIN_RMS) return;

      const previousOverlap = overlapSamples;
      const withOverlap = new Float32Array(previousOverlap.length + joined.length);
      withOverlap.set(previousOverlap, 0);
      withOverlap.set(joined, previousOverlap.length);

      const overlapCount = Math.max(1, Math.floor(sampleRate * (OVERLAP_MS / 1000)));
      const overlapStart = Math.max(0, joined.length - overlapCount);
      overlapSamples = joined.slice(overlapStart);

      const pcm = floatTo16BitPCM(withOverlap);
      const wavBytes = pcmToWavBytes(pcm, sampleRate);

      queue.push({
        audio_b64: bytesToBase64(wavBytes),
        mime_type: 'audio/wav',
      });
      flushQueue();
    }

    async function sendChunk(chunk) {
      const body = {
        audio_b64: chunk.audio_b64,
        previous_text: [stableText, currentBuffer].filter(Boolean).join(' ').slice(-2000),
        language: 'fr',
        mime_type: chunk.mime_type,
      };

      const res = await fetch('/transcribe-chunk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erreur transcription');

      if (data.warning) {
        setStatus(data.warning + ' — transcription en direct...');
        addLog('warning: ' + data.warning);
      } else {
        setStatus('Transcription en direct...');
      }

      const text = (data.text || '').trim();
      if (text) {
        currentBuffer = mergeChunkText(currentBuffer, text);
        maybeStabilize(false);
      }
      renderTranscript();
    }

    async function flushQueue() {
      if (inFlight) return;
      inFlight = true;
      try {
        while (queue.length) {
          const chunk = queue.shift();
          await sendChunk(chunk);
        }
      } catch (e) {
        setStatus('Erreur: ' + e.message);
        addLog('erreur: ' + e.message);
      } finally {
        inFlight = false;
      }
    }

    async function start() {
      stableText = '';
      currentBuffer = '';
      out.textContent = '';
      queue = [];
      pendingSamples = [];
      overlapSamples = new Float32Array(0);
      setStatus('Sélection de l\'onglet...');
      addLog('Démarrage de la capture');

      mediaStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      const audioTracks = mediaStream.getAudioTracks();
      if (!audioTracks.length) {
        throw new Error('Aucune piste audio détectée. Coche "Partager l\'audio".');
      }

      const audioOnly = new MediaStream([audioTracks[0]]);
      audioContext = new AudioContext();
      sampleRate = audioContext.sampleRate;
      sourceNode = audioContext.createMediaStreamSource(audioOnly);
      processorNode = audioContext.createScriptProcessor(4096, 1, 1);

      processorNode.onaudioprocess = (event) => {
        if (!running) return;
        const ch0 = event.inputBuffer.getChannelData(0);
        pendingSamples.push(new Float32Array(ch0));
      };

      sourceNode.connect(processorNode);
      const silentGain = audioContext.createGain();
      silentGain.gain.value = 0;
      processorNode.connect(silentGain);
      silentGain.connect(audioContext.destination);

      flushTimer = setInterval(flushPcmChunk, CHUNK_MS);

      running = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus('Transcription en direct...');
      addLog('Transcription démarrée');

      audioTracks[0].addEventListener('ended', stop);
    }

    function cleanupAudioGraph() {
      if (flushTimer) {
        clearInterval(flushTimer);
        flushTimer = undefined;
      }
      processorNode?.disconnect();
      sourceNode?.disconnect();
      processorNode = undefined;
      sourceNode = undefined;

      if (audioContext && audioContext.state !== 'closed') {
        audioContext.close();
      }
      audioContext = undefined;

      mediaStream?.getTracks().forEach((t) => t.stop());
      mediaStream = undefined;
    }

    function stop() {
      if (!running) return;
      running = false;
      setStatus('Finalisation...');
      addLog('Arrêt demandé');
      cleanupAudioGraph();
      flushPcmChunk();

      startBtn.disabled = false;
      stopBtn.disabled = true;
      flushQueue().finally(() => {
        maybeStabilize(true);
        renderTranscript();
        setStatus('Terminé');
        addLog('Transcription arrêtée');
      });
    }

    startBtn.addEventListener('click', async () => {
      try {
        await start();
      } catch (e) {
        cleanupAudioGraph();
        setStatus('Erreur: ' + e.message);
        addLog('erreur au démarrage: ' + e.message);
      }
    });
    stopBtn.addEventListener('click', stop);
  </script>
</body>
</html>
